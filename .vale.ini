StylesPath = .vale/styles

# Google's guide targets end-user product docs. These files are developer
# tooling docs, so a handful of rules are turned off below.
MinAlertLevel = warning

# Fetched by `vale sync` and gitignored: style packages are pinned dependencies,
# not source. Only the vocabulary is tracked.
Packages = Google

Vocab = FinFocus

[*.md]
BasedOnStyles = Vale, Google

# Disable overly strict Google rules for developer docs

# Wants word—word. These docs use spaced em dashes.
Google.EmDash = NO

# Wants sentence-case headings. Developer docs use Title Case.
Google.Headings = NO

# Falls out of the heading style plus code examples.
Google.Colons = NO

# Bans future tense. Instructions legitimately say what commands will do.
Google.Will = NO

# Bans first person. Developer docs use "you" and "we".
Google.We = NO
Google.FirstPerson = NO

# Prefers formal register; technical docs use informal language appropriately.
Google.Contractions = NO

# Prefers "please" instead of "thanks"; not applicable to code docs.
Google.Exclamation = NO

# Range format conflicts with technical ranges (e.g., "1.0–2.0").
Google.Range = NO

# WordList is overly prescriptive for technical documentation.
Google.WordList = NO

# Acronyms: CLI, SDK, etc. are standard in technical writing.
Google.Acronyms = NO
