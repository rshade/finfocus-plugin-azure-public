name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          install_args: go golangci-lint actionlint go:golang.org/x/vuln/cmd/govulncheck

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run govulncheck
        # GO-2026-6443: grpc v1.84.0 has a vulnerability, fixed only in dev version
        # This affects all plugins and is non-blocking until upstream releases fix.
        run: govulncheck ./...
        continue-on-error: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          install_args: actionlint

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          install_args: go goreleaser

      - name: Verify goreleaser config
        run: goreleaser check
